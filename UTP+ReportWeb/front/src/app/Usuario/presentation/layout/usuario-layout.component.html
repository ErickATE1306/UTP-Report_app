<div class="marco">
  <header class="encabezado">
    <div class="encabezado__fila">
      @if (!esInicio()) {
        <button type="button" class="icono-btn" aria-label="Volver" (click)="volver()">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </button>
      }
      <a class="marca" routerLink="/usuario">UTP Reporta</a>

      <nav class="nav-escritorio" aria-label="Secciones">
        @for (enlace of enlaces; track enlace.ruta) {
          <a [routerLink]="enlace.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: enlace.exacto }">
            {{ enlace.etiqueta }}
          </a>
        }
      </nav>

      <a class="icono-btn campana" routerLink="/usuario/notificaciones"
        [attr.aria-label]="noLeidas() ? 'Notificaciones, ' + noLeidas() + ' sin leer' : 'Notificaciones'">
        <i class="bi bi-bell" aria-hidden="true"></i>
        @if (noLeidas()) { <span class="punto" aria-hidden="true"></span> }
      </a>
      <button type="button" class="icono-btn" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="contenido"><router-outlet /></main>

  <nav class="nav-movil" aria-label="Secciones">
    @for (enlace of enlaces; track enlace.ruta) {
      <a [routerLink]="enlace.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: enlace.exacto }">
        <i class="bi" [class]="enlace.icono" aria-hidden="true"></i>
        <span>{{ enlace.etiqueta }}</span>
      </a>
    }
  </nav>
</div>
